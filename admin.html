<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报备管理后台 · 天凛俱乐部</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 游戏几何背景装饰 -->
  <div class="geo-bg"></div>
  <div class="geo-shape geo-hex-1"></div>
  <div class="geo-shape geo-hex-2"></div>
  <div class="geo-shape geo-tri-1"></div>
  <div class="geo-shape geo-dia-1"></div>
  <div class="geo-shape geo-ring-1"></div>
  <div class="geo-shape geo-cross-1"></div>
  <div class="geo-wave"></div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="page-wrap">
    <header class="app-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"/>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
        </svg>
        <h1>天凛俱乐部 · 报备管理后台</h1>
      </div>
      <div class="header-actions">
        <span id="adminName" style="font-size:13px;color:var(--text-tertiary);">管理员</span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          退出
        </button>
      </div>
    </header>

    <main style="padding: 20px; max-width: 1200px; margin: 0 auto;">
      <!-- 统计卡片 -->
      <div class="stats-grid page-enter">
        <div class="stat-card">
          <div class="stat-label">总报备单数</div>
          <div class="stat-value" id="statTotalOrders">0</div>
          <div class="stat-change">单</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总订单金额</div>
          <div class="stat-value" id="statTotalPrice">¥0.00</div>
          <div class="stat-change">元</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">陪陪总分成</div>
          <div class="stat-value" id="statTotalPeipei">¥0.00</div>
          <div class="stat-change" style="color:var(--chart-1);">按当前比例</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">活跃陪陪</div>
          <div class="stat-value" id="statActivePeipei">0</div>
          <div class="stat-change">人</div>
        </div>
      </div>

      <!-- 分成配置面板 -->
      <div class="card page-enter" style="margin-bottom: 16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h3 class="card-title" style="margin:0;display:flex;align-items:center;gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            分成比例配置
          </h3>
          <button class="btn btn-sm" onclick="toggleSplitEdit()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            修改比例
          </button>
        </div>

        <!-- 当前配置展示 -->
        <div style="overflow-x:auto;">
          <table class="summary-table" style="margin-top:0;">
            <thead>
              <tr>
                <th>角色</th>
                <th style="text-align:right">陪陪</th>
                <th style="text-align:right">场控</th>
                <th style="text-align:right">直属</th>
                <th style="text-align:right">俱乐部</th>
                <th style="text-align:right">状态</th>
              </tr>
            </thead>
            <tbody id="splitConfigBody">
              <tr><td colspan="6" class="empty-cell">加载中...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- 编辑面板 -->
        <div id="splitEditPanel" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-color);">
          <h4 style="margin:0 0 12px;font-size:14px;font-weight:500;color:var(--text-secondary);">编辑分成比例（小数形式，如 0.8 表示 80%）</h4>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;margin-bottom:12px;">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">陪陪</label>
              <input type="number" class="form-input" id="sPeipei" step="0.01" min="0" max="1" oninput="updateSplitPreview()" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">场控</label>
              <input type="number" class="form-input" id="sChangkong" step="0.01" min="0" max="1" oninput="updateSplitPreview()" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">直属</label>
              <input type="number" class="form-input" id="sZhishu" step="0.01" min="0" max="1" oninput="updateSplitPreview()" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">俱乐部</label>
              <input type="number" class="form-input" id="sOwner" step="0.01" min="0" max="1" oninput="updateSplitPreview()" />
            </div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span id="splitTotalPreview" style="font-size:13px;font-weight:500;">当前合计：100%</span>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-sm" onclick="resetSplitSettings()">恢复默认</button>
              <button class="btn btn-primary btn-sm" onclick="saveSplitSettings()">保存设置</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 筛选与操作 -->
      <div class="card page-enter" style="margin-bottom: 16px;">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">
          <h3 class="card-title" style="margin:0;display:flex;align-items:center;gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            筛选条件
          </h3>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-sm" onclick="resetFilters()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
              重置
            </button>
            <button class="btn btn-primary btn-sm" onclick="exportData()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              导出 Excel
            </button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="filter-group">
            <label>开始日期</label>
            <input type="date" class="form-input" id="fStartDate" onchange="applyFilters()" />
          </div>
          <div class="filter-group">
            <label>结束日期</label>
            <input type="date" class="form-input" id="fEndDate" onchange="applyFilters()" />
          </div>
          <div class="filter-group">
            <label>陪陪</label>
            <select class="form-select" id="fPeipei" onchange="applyFilters()">
              <option value="">全部陪陪</option>
            </select>
          </div>
          <div class="filter-group">
            <label>场控</label>
            <select class="form-select" id="fChangkong" onchange="applyFilters()">
              <option value="">全部场控</option>
            </select>
          </div>
          <div class="filter-group">
            <label>单子项目</label>
            <select class="form-select" id="fProject" onchange="applyFilters()">
              <option value="">全部项目</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 数据表格 -->
      <div class="card page-enter" style="margin-bottom: 16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h3 class="card-title" style="margin:0;display:flex;align-items:center;gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            报备记录明细
          </h3>
          <span id="recordCount" style="font-size:13px;color:var(--text-tertiary);">共 0 条记录</span>
        </div>
        <div style="overflow-x:auto;">
          <table class="data-table" id="dataTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>日期</th>
                <th>板板</th>
                <th>陪陪</th>
                <th>直属</th>
                <th>场控</th>
                <th>单子项目</th>
                <th style="text-align:right">单价</th>
                <th style="text-align:right">陪陪分成</th>
                <th style="text-align:right">场控分成</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="11" class="empty-cell">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>

      <!-- 统计汇总 -->
      <div class="card page-enter">
        <h3 class="card-title" style="display:flex;align-items:center;gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/>
          </svg>
          按陪陪统计汇总
        </h3>
        <div style="overflow-x:auto;">
          <table class="summary-table" id="summaryTable">
            <thead>
              <tr>
                <th>陪陪</th>
                <th style="text-align:right">总单数</th>
                <th style="text-align:right">总订单金额</th>
                <th style="text-align:right">陪陪分成</th>
                <th style="text-align:right">场控分成</th>
                <th style="text-align:right">直属分成</th>
                <th style="text-align:right">俱乐部分成</th>
              </tr>
            </thead>
            <tbody id="summaryBody">
              <tr><td colspan="7" class="empty-cell">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
