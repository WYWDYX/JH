<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天凛俱乐部 · 报备填报</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 游戏几何背景装饰 -->
  <div class="geo-bg"></div>
  <div class="geo-shape geo-hex-1"></div>
  <div class="geo-shape geo-hex-2"></div>
  <div class="geo-shape geo-tri-1"></div>
  <div class="geo-shape geo-dia-1"></div>
  <div class="geo-shape geo-ring-1"></div>
  <div class="geo-shape geo-cross-1"></div>
  <div class="geo-wave"></div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="page-wrap">
    <header class="app-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <h1>天凛俱乐部 · 报备填报</h1>
      </div>
      <a href="login.html" class="btn btn-ghost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        管理后台
      </a>
    </header>

    <main style="max-width: 520px; margin: 0 auto; padding: 24px 20px 40px;">
      <!-- 快速粘贴识别 -->
      <div class="card page-enter" style="margin-bottom: 16px;">
        <h2 class="card-title" style="display:flex;align-items:center;gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          </svg>
          快速粘贴识别
        </h2>
        <textarea class="form-input" id="pasteArea" rows="5" placeholder="在此粘贴报备文本，系统将自动识别填充" style="resize:vertical;font-size:14px;line-height:1.6;"></textarea>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" class="btn btn-sm" onclick="clearPaste()">清空</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="parseAndFill()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            识别填充
          </button>
        </div>
      </div>

      <div class="card page-enter" style="margin-bottom: 16px;">
        <h2 class="card-title" style="display:flex;align-items:center;gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="9" y1="16" x2="15" y2="16"/>
            <line x1="9" y1="8" x2="11" y2="8"/>
          </svg>
          填写报备信息
        </h2>

        <form id="reportForm" onsubmit="handleReportSubmit(event)">
          <div class="form-group">
            <label class="form-label">日期</label>
            <input type="date" class="form-input" id="rDate" required />
          </div>

          <div class="form-group">
            <label class="form-label">板板</label>
            <input type="text" class="form-input" id="rBanban" placeholder="请输入板板" required />
          </div>

          <div class="form-group">
            <label class="form-label">陪陪</label>
            <input type="text" class="form-input" id="rPeipei" placeholder="请输入陪陪" required list="peipeiList" />
            <datalist id="peipeiList"></datalist>
          </div>

          <div class="form-group">
            <label class="form-label">直属</label>
            <input type="text" class="form-input" id="rZhishu" placeholder="请输入直属" required />
          </div>

          <div class="form-group">
            <label class="form-label">场控</label>
            <input type="text" class="form-input" id="rChangkong" placeholder="请输入场控" required list="changkongList" />
            <datalist id="changkongList"></datalist>
          </div>

          <div class="form-group">
            <label class="form-label">单子项目</label>
            <input type="text" class="form-input" id="rProject" placeholder="请输入单子项目" required />
          </div>

          <div class="form-group">
            <label class="form-label">单价</label>
            <input type="number" class="form-input" id="rPrice" placeholder="请输入单价" step="0.01" min="0.01" required oninput="updatePreview()" />
            <div class="form-hint" id="priceHint">单价必须大于 0</div>
          </div>

          <div class="amount-preview">
            <span class="amount-preview-label">陪陪分成预览</span>
            <span class="amount-preview-value" id="previewAmount">¥0.00</span>
          </div>

          <div style="margin-top: 24px; text-align: center;">
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              提交报备
            </button>
          </div>
        </form>
      </div>

      <div style="text-align: center; color: var(--text-quaternary); font-size: 12px;">
        提交后数据将自动计算并保存 · 管理后台可查看汇总
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
