<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台登录 · 陪玩俱乐部</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 游戏几何背景装饰 -->
  <div class="geo-bg"></div>
  <div class="geo-shape geo-hex-1"></div>
  <div class="geo-shape geo-hex-2"></div>
  <div class="geo-shape geo-tri-1"></div>
  <div class="geo-shape geo-dia-1"></div>
  <div class="geo-shape geo-ring-1"></div>
  <div class="geo-shape geo-cross-1"></div>
  <div class="geo-wave"></div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="page-wrap">
    <header class="app-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <h1>陪玩俱乐部 · 报备系统</h1>
      </div>
      <a href="index.html" class="btn btn-ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14L4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
        返回填报
      </a>
    </header>

    <main class="login-container page-enter">
      <div style="text-align: center; margin-bottom: 32px;">
        <div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:var(--radius-xl);background:var(--text-primary);color:#fff;margin-bottom:16px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h2 style="margin:0;font-size:20px;font-weight:500;color:var(--text-primary);">管理后台登录</h2>
        <p style="margin:8px 0 0;color:var(--text-tertiary);font-size:14px;">陪玩俱乐部报备管理系统</p>
      </div>

      <div class="login-card">
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">用户名</label>
            <input type="text" class="form-input" id="loginUser" placeholder="admin" required />
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" class="form-input" id="loginPass" placeholder="admin123" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            登录
          </button>
        </form>
        <div style="margin-top:16px;text-align:center;font-size:12px;color:var(--text-quaternary);">
          测试账号：admin / admin123
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
